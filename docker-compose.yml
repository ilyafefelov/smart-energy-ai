version: '3.9'

services:
  dagster:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DAGSTER_HOME=/app/.dagster
      - PYTHONUNBUFFERED=1
    volumes:
      - .:/app
      - dagster_data:/app/.dagster
    working_dir: /app
    command: dagster dev -h 0.0.0.0 -p 3000

volumes:
  dagster_data:
