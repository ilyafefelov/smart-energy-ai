# Dagster configuration for Smart Energy AI V2

# Schedule definitions
scheduler:
  module: dagster_cron
  class: SystemCronScheduler

# Storage configuration
storage:
  postgres:
    postgres_db:
      username: dagster
      password: dagster123
      hostname: localhost
      db_name: dagster
      port: 5432

# Compute log storage
compute_logs:
  module: dagster_postgres.storage
  class: DagsterPostgresStorage
  config:
    postgres_db:
      username: dagster
      password: dagster123
      hostname: localhost
      db_name: dagster
      port: 5432

# Event log storage
event_log_storage:
  module: dagster_postgres.storage
  class: DagsterPostgresStorage
  config:
    postgres_db:
      username: dagster
      password: dagster123
      hostname: localhost
      db_name: dagster
      port: 5432

# Run storage
run_storage:
  module: dagster_postgres.storage
  class: DagsterPostgresStorage
  config:
    postgres_db:
      username: dagster
      password: dagster123
      hostname: localhost
      db_name: dagster
      port: 5432

# Telemetry (disable for privacy)
telemetry:
  enabled: false